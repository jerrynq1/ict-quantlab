[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "ict-quantlab-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.9", "pydantic-settings>=2.4", "cryptography>=43.0", "httpx>=0.27", "polars>=1.8", "numpy>=2.0", "scipy>=1.14", "statsmodels>=0.14", "scikit-learn>=1.5", "ctrader-open-api==0.9.2"]
[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
